name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pure-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax and JSON checks
        run: |
          python -m compileall -q __init__.py moc_minimax tests scripts
          python -m json.tool examples/minimax_h3_reference_plus_api.json > /dev/null
          python -m json.tool example_workflows/minimax_h3_moc_authoring_preflight.json > /dev/null
